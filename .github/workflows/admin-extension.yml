name: Admin Extension

# Builds and publishes the Docker Desktop extension - the tab that starts the admin UI and hands it
# the database containers already running on the machine.
#
# Docker Hub is the primary here, not the mirror it is for the admin image: the Extensions
# Marketplace publishes from Docker Hub, and `docker extension install` is quoted against it. GHCR
# gets the same digests anyway so the two registries never disagree about what a version contains.
#
# Separate from admin-image.yml on purpose. This image is a few kilobytes of static files with no
# .NET in it at all, it changes on a completely different rhythm from the ~1GB app image, and the
# extension manager requires a semver tag - none of which the admin image build wants to care about.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v*
    paths:
      - 'src/ShinyDocDbMyAdmin.Extension/**'
      - 'version.json'
      - '.github/workflows/admin-extension.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shinyorg/shiny-docdb-myadmin-extension
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: aritchie/shiny-docdb-myadmin-extension

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Same version as the admin image and the NuGets. The extension pins no image tag of its own -
      # it starts `:latest` unless you type otherwise - so this is purely the extension manager's
      # requirement that the tag be semver, and keeping it in step means one number describes the
      # whole release.
      - name: Resolve version
        id: nbgv
        run: |
          dotnet tool install --global nbgv
          echo "version=$(nbgv get-version -v NuGetPackageVersion --public-release=true)" >> "$GITHUB_OUTPUT"

      - name: Is the Docker Hub publish configured?
        id: mirror
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set - the extension is going to GHCR only, which the Marketplace cannot publish from."
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.mirror.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` only from the default branch, matching admin-image.yml - an older v* maintenance
      # branch publishes its version and nothing that moves.
      - name: Resolve tags
        id: tags
        run: |
          IMAGES="${REGISTRY}/${IMAGE_NAME}"
          if [ "${MIRROR}" = "true" ]; then
            IMAGES="${IMAGES} ${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"
          fi

          TAGS=""
          for image in ${IMAGES}; do
            TAGS="${TAGS}${TAGS:+,}${image}:${VERSION}"
            if [ -n "${DEFAULT_BRANCH}" ] && [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
              TAGS="${TAGS},${image}:latest"
            fi
          done
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.nbgv.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MIRROR: ${{ steps.mirror.outputs.enabled }}

      # No provenance or SBOM: the extension manager reads the manifest list looking for the two
      # platforms, and the extra attestation manifests are noise in something this small.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src/ShinyDocDbMyAdmin.Extension
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          push: true

      # `docker extension validate` is a Docker Desktop plugin and does not exist on a runner, so the
      # parts of it that can be checked headlessly are checked here instead: the labels the extension
      # manager requires are present, both platforms made it into the manifest list, and every URL a
      # label points at actually resolves. That last one is the check that fails in practice - the
      # icon and screenshots are raw.githubusercontent links into this repo, so they only start
      # working once the commit that adds them is pushed.
      #
      # The full validate stays a local step before a Marketplace submission; see the readme.
      - name: Verify the published extension
        run: |
          echo "Platforms:"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}' | tee /tmp/platforms
          for platform in linux/amd64 linux/arm64; do
            grep -qx "${platform}" /tmp/platforms || { echo "::error::${platform} missing from the manifest list"; exit 1; }
          done

          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Image}}' > /tmp/image.json

          # For a multi-platform image `.Image` is a map keyed by platform - {"linux/amd64": {...},
          # "linux/arm64": {...}} - not the config. Reading `.config.Labels` off the top level there
          # yields null, and every label then reports as missing while the image is perfectly fine.
          # Normalise both shapes to one Labels object; `add` merges the platforms, which carry the
          # same labels because they come from one Dockerfile.
          jq '(.config.Labels) // (to_entries | map(.value.config.Labels) | add)' /tmp/image.json > /tmp/labels.json

          for label in \
            org.opencontainers.image.title \
            org.opencontainers.image.description \
            org.opencontainers.image.vendor \
            com.docker.desktop.extension.api.version \
            com.docker.desktop.extension.icon \
            com.docker.extension.screenshots \
            com.docker.extension.detailed-description \
            com.docker.extension.publisher-url \
            com.docker.extension.changelog
          do
            jq -e --arg l "${label}" '.[$l] // empty' /tmp/labels.json > /dev/null \
              || { echo "::error::required label ${label} is missing"; exit 1; }
          done
          echo "All required labels present."

          # The icon, every screenshot and every additional URL. Read from a file rather than a pipe:
          # a piped `while` runs in a subshell, where the exit below would set that subshell's status
          # and leave the step green.
          jq -r '
            (.["com.docker.desktop.extension.icon"] // empty),
            ((.["com.docker.extension.screenshots"] // "[]") | fromjson | .[].url),
            ((.["com.docker.extension.additional-urls"] // "[]") | fromjson | .[].url)
          ' /tmp/labels.json > /tmp/urls

          while read -r url; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "${url}")
            echo "${code} ${url}"
            [ "${code}" = "200" ] || { echo "::error::${url} returned ${code}"; exit 1; }
          done < /tmp/urls
        env:
          IMAGE: ${{ steps.mirror.outputs.enabled == 'true' && format('{0}/{1}', env.DOCKERHUB_REGISTRY, env.DOCKERHUB_IMAGE_NAME) || format('{0}/{1}', env.REGISTRY, env.IMAGE_NAME) }}
          VERSION: ${{ steps.nbgv.outputs.version }}
