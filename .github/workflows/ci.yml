name: CI

# Every push to main, and every pull request into it: build, test and pack the way a release does, without
# publishing. Releases come from tags - see release.yml. Toolchain pins match release.yml - bump them together.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.claude-plugins/**'
      - 'skills/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET 10.0 + 11.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: |
            10.0.x
            11.0.x
          workloads: maui-ios, maui-android, maui-maccatalyst

    # The Android sqlite-vec .so are compiled from source (see build/build-sqlite-vec.sh) so they get
    # 16 KB page alignment; that needs the NDK. Its toolchain is darwin-x86_64 only, so an arm64
    # runner runs it through Rosetta.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Android NDK
      run: |
        sdkmanager --install "ndk;28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
        sudo softwareupdate --install-rosetta --agree-to-license || true

    - name: Fetch sqlite-vec native binaries
      run: bash build/build-sqlite-vec.sh

    - name: Build
      run: dotnet build build.slnf /restore -m -property:Configuration=Release

    - name: Test (SQLite)
      run: dotnet test --project tests/Shiny.DocumentDb.Tests/Shiny.DocumentDb.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Sqlite" --report-xunit-trx --report-xunit-trx-filename test-results-sqlite.trx

    # The libraries ship net10.0 + net11.0; the test projects default to net11.0, so run the SQLite suite once
    # more against the net10.0 build to catch runtime behaviour changes between the two.
    - name: Test (SQLite, net10.0)
      run: dotnet test --project tests/Shiny.DocumentDb.Tests/Shiny.DocumentDb.Tests.csproj --configuration Release -property:BaseTargetFramework=net10.0 --filter "FullyQualifiedName~Sqlite" --report-xunit-trx --report-xunit-trx-filename test-results-sqlite-net10.trx

    # C# union types need net11.0 + C# 15, so their query tests live in their own net11.0 project.
    - name: Test (Unions, SQLite)
      run: dotnet test --project tests/Shiny.DocumentDb.Unions.Tests/Shiny.DocumentDb.Unions.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~SQLite|FullyQualifiedName~UnionSupportUnitTests" --report-xunit-trx --report-xunit-trx-filename test-results-unions.trx

    - name: Test (SQLite Vec)
      run: dotnet test --project tests/Shiny.DocumentDb.Sqlite.VectorSupport.Tests/Shiny.DocumentDb.Sqlite.VectorSupport.Tests.csproj --configuration Release --no-build --report-xunit-trx --report-xunit-trx-filename test-results-sqlite-vec.trx

    # Runs the real ILC compiler over the library. Catches trim/AOT breaks the Roslyn analyzers cannot see —
    # warnings out of dependencies, and anything only reachable through a call graph. Warnings are errors in
    # this project, so a regression fails the build here.
    - name: Verify Native AOT
      run: dotnet publish samples/Sample.Aot/Sample.Aot.csproj -r osx-arm64 --configuration Release

    - name: Run Native AOT binary
      run: ./samples/Sample.Aot/bin/Release/net11.0/osx-arm64/publish/Sample.Aot

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: |
          src/**/bin/Release/*.nupkg
          src/**/bin/Release/*.snupkg
        retention-days: 5

