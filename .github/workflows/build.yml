name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
    - main
    - dev
    - preview
    - v*
    paths-ignore:
      - '.claude-plugins/**'
      - 'skills/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
          fetch-depth: 0

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: '10.0.x'

    - name: Fetch sqlite-vec native binaries
      run: bash build/build-sqlite-vec.sh

    - name: Build
      run: dotnet build build.slnf /restore -m -property:Configuration=Release -property:PublicRelease=true

    - name: Test (SQLite)
      run: dotnet test tests/Shiny.DocumentDb.Tests/Shiny.DocumentDb.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Sqlite" --logger "trx;LogFileName=test-results-sqlite.trx"

    - name: Test (SQLite Vec)
      run: dotnet test tests/Shiny.DocumentDb.Sqlite.VectorSupport.Tests/Shiny.DocumentDb.Sqlite.VectorSupport.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results-sqlite-vec.trx"

    # Runs the real ILC compiler over the library. Catches trim/AOT breaks the Roslyn analyzers cannot see —
    # warnings out of dependencies, and anything only reachable through a call graph. Warnings are errors in
    # this project, so a regression fails the build here.
    - name: Verify Native AOT
      run: dotnet publish samples/Sample.Aot/Sample.Aot.csproj -r osx-arm64 --configuration Release

    - name: Run Native AOT binary
      run: ./samples/Sample.Aot/bin/Release/net10.0/osx-arm64/publish/Sample.Aot

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nugets
        path: ${{ github.workspace }}/artifacts
        retention-days: 5

    - name: Publish NuGets
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      run: dotnet nuget push **\*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGETAPIKEY }}

