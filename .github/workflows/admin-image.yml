name: Admin Image

# Builds and publishes ghcr.io/shinyorg/shiny-docdb-myadmin - the DocumentDb Admin UI - under two
# tags from one build:
#
#   :<version> / :latest   the ordinary tool. Everything works; you supply the connections.
#   :demo-<version> / :demo   the same image with ShinyDocDbMyAdmin__DemoMode already set - a public
#                             playground that builds its own read-only sample on first start.
#
# One package with two tags rather than two packages: the demo image is the base image plus a single
# ENV layer, so tagging shares every blob in the registry instead of storing ~1GB twice.
#
# Published by release.yml, under the release tag's version, deliberately: the Aspire integration
# (AddDocumentDbAdmin) defaults its image tag to its own package version, so a release that
# publishes Shiny.DocumentDb.Aspire.Hosting 14.5.0 needs a 14.5.0 image to exist alongside it.
#
# Built natively per architecture rather than cross-built under QEMU - a full `dotnet publish`
# emulated for arm64 takes an order of magnitude longer than running it on an arm runner.
#
# The same image is mirrored to Docker Hub (docker.io/aritchie/shiny-docdb-myadmin) for people who
# look there first. GHCR stays canonical - it is what AddDocumentDbAdmin pulls and what the docs
# quote - so the mirror is byte-identical rather than a separate build: the build pushes one set of
# digests to both repositories, and each registry's tags are manifest lists over those same digests.
#
# The mirror is skipped when DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not configured, so the GHCR
# publish this repo has always done keeps working on a fork, or before the secrets are added.

on:
  # release.yml calls this once the NuGets for <version> are live.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  # By hand, to republish an already-released version (e.g. after a base-image security update).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 14.5.0 or 14.5.0-beta.1) - should match a released NuGet version'
        required: true

concurrency:
  group: admin-image-${{ inputs.version }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shinyorg/shiny-docdb-myadmin
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: aritchie/shiny-docdb-myadmin

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
      mirror: ${{ steps.mirror.outputs.enabled }}
    steps:
      # The release tag's version. A prerelease (anything after '-') never moves `latest`.
      - name: Resolve version
        id: version
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '${VERSION}' must look like 14.5.0 or 14.5.0-beta.1"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then echo "latest=false" >> "$GITHUB_OUTPUT"; else echo "latest=true" >> "$GITHUB_OUTPUT"; fi
        env:
          VERSION: ${{ inputs.version }}

      # Decided once, here, rather than re-tested with `if:` on every step that touches Docker Hub -
      # the three jobs below have to agree on whether the mirror exists, and a single output is the
      # only way they can. The `secrets` context is not readable from a job-level `outputs:` block,
      # which is why this is a step.
      - name: Is the Docker Hub mirror configured?
        id: mirror
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set - publishing to GHCR only."
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ needs.version.outputs.mirror == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One build, pushed to both repositories in the same step. Naming both here rather than copying
      # afterwards is what makes the mirror byte-identical: buildx uploads a single set of blobs under
      # one digest, and the manifest job then only has to point tags at digests that already exist in
      # each registry.
      - name: Resolve push targets
        id: targets
        run: |
          NAMES="${REGISTRY}/${IMAGE_NAME}"
          if [ "${MIRROR}" = "true" ]; then
            NAMES="${NAMES},${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"
          fi
          echo "names=${NAMES}" >> "$GITHUB_OUTPUT"
        env:
          MIRROR: ${{ needs.version.outputs.mirror }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/ShinyDocDbMyAdmin/Dockerfile
          platforms: ${{ matrix.platform }}
          # So the assembly baked into the image reports the version the image is tagged with.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          # `name` holds a comma-separated list, so it has to be quoted - the commas would otherwise
          # read as separators between output attributes.
          outputs: type=image,"name=${{ steps.targets.outputs.names }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          touch "/tmp/digests/${digest}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ needs.version.outputs.mirror == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` moves with every stable release; a prerelease publishes its version tag and nothing else.
      #
      # Once per repository, each pointed at its own copy of the digests the build job pushed. One
      # `imagetools create` naming both would work too - it copies blobs across registries - but the
      # blobs are already there, so this only writes the two manifest lists.
      - name: Create manifest lists
        working-directory: /tmp/digests
        run: |
          IMAGES="${REGISTRY}/${IMAGE_NAME}"
          if [ "${MIRROR}" = "true" ]; then
            IMAGES="${IMAGES} ${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"
          fi

          for image in ${IMAGES}; do
            TAGS="-t ${image}:${VERSION}"
            if [ "${LATEST}" = "true" ]; then
              TAGS="${TAGS} -t ${image}:latest"
            fi
            echo "Tagging: ${TAGS}"

            # shellcheck disable=SC2046
            docker buildx imagetools create ${TAGS} \
              $(printf "${image}@sha256:%s " *)
          done
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
          MIRROR: ${{ needs.version.outputs.mirror }}

      - name: Inspect
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          if [ "${MIRROR}" = "true" ]; then
            docker buildx imagetools inspect "${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}:${VERSION}"
          fi
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MIRROR: ${{ needs.version.outputs.mirror }}

  # The playground tag: the image just published, plus one ENV layer. Built multi-arch in one step
  # because there is nothing per-architecture about it - buildx pulls the base manifest for each
  # platform and adds the same layer to each.
  demo:
    needs: [version, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ needs.version.outputs.mirror == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Keyed to the version rather than to `latest`, so the demo tag is built from the image this
      # run produced even if another run publishes `latest` in between. The base stays GHCR on both
      # sides - it is the canonical copy, and the mirror's blobs are identical anyway.
      - name: Resolve tags
        id: tags
        run: |
          IMAGES="${REGISTRY}/${IMAGE_NAME}"
          if [ "${MIRROR}" = "true" ]; then
            IMAGES="${IMAGES} ${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE_NAME}"
          fi

          TAGS=""
          for image in ${IMAGES}; do
            TAGS="${TAGS}${TAGS:+,}${image}:demo-${VERSION}"
            if [ "${LATEST}" = "true" ]; then
              TAGS="${TAGS},${image}:demo"
            fi
          done
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
          MIRROR: ${{ needs.version.outputs.mirror }}

      - name: Build and push the demo tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/ShinyDocDbMyAdmin/Dockerfile.demo
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BASE_TAG=${{ needs.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true

      - name: Inspect
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:demo-${VERSION}"
        env:
          VERSION: ${{ needs.version.outputs.version }}

  # Repoints the root compose.yaml (the Dockhand stack) at the image this run published, by committing
  # the new digest to its `x-admin-image` line. Doing it here - after `manifest` and `demo` - means the
  # stack never pulls ahead of an image that is still building: Dockhand redeploys on any commit, but
  # every other commit redeploys the digest already pinned.
  #
  # Pinned by digest rather than version so a by-hand republish of the same version still moves the
  # stack. Stable releases only, the same line `:latest` follows, committed to the default branch
  # (the run itself is on a tag). A GITHUB_TOKEN push starts no workflows, so the commit cannot loop
  # back into a rebuild.
  stack:
    needs: [version, manifest, demo]
    if: ${{ needs.version.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digest of the manifest list, not of either platform image, so the pin works on amd64 and
      # arm64 hosts alike.
      - name: Resolve digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=${REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      # The branch has usually moved during a ~15 minute build, so rebase onto it and retry rather than
      # fail on a non-fast-forward. No change means the digest is already pinned (a re-run).
      - name: Commit the pin
        run: |
          FILE=compose.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            sed -i "s|^x-admin-image: &admin-image .*|x-admin-image: \&admin-image ${IMAGE}|" "${FILE}"

            if git diff --quiet -- "${FILE}"; then
              echo "Stack already pinned to ${IMAGE}"
              exit 0
            fi

            git commit -m "Deploy ShinyDocDbMyAdmin ${VERSION} to the Dockhand stack" -- "${FILE}"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the stack pin after 5 attempts"
          exit 1
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
