name: Feature Request
description: You have an idea for an enhancement within Shiny DocumentDb
title: "[Feature Request]: "
labels: [feature request, unverified]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature and, where relevant, which provider(s) it should apply to.

        > ⭐ **Finding this library useful? Please give the repository a [Star](https://github.com/shinyorg/DocumentDb) - it's free and it's how the project gets seen.**
  - type: textarea
    attributes:
      label: Summary
      description: Your summary of the feature
    validations:
      required: true
  - type: textarea
    attributes:
      label: API Changes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Intended Use Case
    validations:
      required: true
